name: Bug report
description: Report a reproducible problem in Workgrid
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please include enough detail for the issue to be reproduced.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: A clear description of the bug and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence of steps that reproduces the issue.
      placeholder: |
        1. Sign in as ...
        2. Open ...
        3. Click ...
        4. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Node.js version, or deployment environment if relevant.
      placeholder: Chrome 155, Windows 11, Node.js 22
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add relevant logs, screenshots, or error messages. Remove secrets before posting.
