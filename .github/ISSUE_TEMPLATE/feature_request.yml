name: Feature request
description: Propose an improvement to Workgrid
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Focus on the user problem first, then the proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or workflow problem should this solve?
      placeholder: Describe the current limitation or friction.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
      placeholder: Explain the expected workflow or interface.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives, trade-offs, or workarounds you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, related issues, or technical notes if useful.
