name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workgrid_test?schema=public
      JWT_SECRET: ci-test-secret-that-is-longer-than-thirty-two-characters
      CORS_ORIGIN: http://localhost:3000

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        run: npm install
      - name: Install web dependencies
        run: npm --prefix web install
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint API
        run: npm run lint
      - name: Typecheck API
        run: npm run typecheck
      - name: Test API
        run: npm test
      - name: Build API
        run: npm run build
      - name: Build web dashboard
        run: npm run build:web
