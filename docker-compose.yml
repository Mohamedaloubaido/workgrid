services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workgrid
    ports:
      - "5432:5432"
    volumes:
      - workgrid_pg:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "4000:4000"

volumes:
  workgrid_pg:
